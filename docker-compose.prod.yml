services:
  postgres:
    image: postgres:16-alpine
    container_name: hers365-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hers365
      POSTGRES_USER: hers365_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Secr3tP4ssw0rd_Hers365_Prod!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hers365_admin -d hers365"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hers365-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hers365-api
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:4000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 15s
      timeout: 10s
      retries: 5

  web:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
        VITE_REGISTRATION_ENABLED: "true"
    container_name: hers365-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.hers365.loadbalancer.server.port=80"
      # Hostinger staging/preview domain (immediate valid SSL right now)
      - "traefik.http.routers.hers365-staging.rule=Host(`srv1829607.hstgr.cloud`)"
      - "traefik.http.routers.hers365-staging.entrypoints=websecure"
      - "traefik.http.routers.hers365-staging.tls=true"
      - "traefik.http.routers.hers365-staging.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hers365-staging-http.rule=Host(`srv1829607.hstgr.cloud`)"
      - "traefik.http.routers.hers365-staging-http.entrypoints=web"
      # Production custom domain (will automatically acquire SSL once DNS flips to 168.231.75.148)
      - "traefik.http.routers.hers365-prod.rule=Host(`hers365.app`) || Host(`www.hers365.app`)"
      - "traefik.http.routers.hers365-prod.entrypoints=websecure"
      - "traefik.http.routers.hers365-prod.tls=true"
      - "traefik.http.routers.hers365-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hers365-prod-http.rule=Host(`hers365.app`) || Host(`www.hers365.app`)"
      - "traefik.http.routers.hers365-prod-http.entrypoints=web"

volumes:
  postgres_data:
  redis_data:
